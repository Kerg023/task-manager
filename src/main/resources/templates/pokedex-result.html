<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado</title>
</head>
<body>

    <div th:if="${pokemon != null}">
        <h1 th:text="'Resultado de la búsqueda: ' + ${pokemon.name}"></h1>
        <p><strong>Nombre:</strong> <span th:text="${pokemon.name}"></span></p>
        <p><strong>Altura:</strong> <span th:text="${pokemon.height}"></span></p>
        <p><strong>Peso:</strong> <span th:text="${pokemon.weight}"></span></p>
        <p><strong>Habilidades:</strong>
            <span th:each="ability : ${pokemon.abilities}" th:text="${ability.ability.name} + ' '"></span>
        </p>
    </div>

    <div th:if="${error != null}">
        <h1>Error</h1>
        <p th:text="${error}"></p>
    </div>

    <a th:href="@{/pokedex}" class="btn">Volver</a>
    
</body>
</html>
