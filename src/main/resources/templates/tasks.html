<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Tareas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="header">
    <div>
        <h1>Tareas</h1>
        <p class="subtitle" th:text="${tasks.size()} + ' tareas'"></p>
    </div>
    <a class="btn" th:href="@{/tasks/new}"><i class="ti ti-plus"></i>Nueva</a>
</div>

<div class="filters">
    <a th:href="@{/tasks}" th:classappend="${selectedStatus == null and selectedPriority == null} ? 'active'">Todas</a>
    <a th:href="@{/tasks(status='PENDING')}" th:classappend="${selectedStatus != null and selectedStatus.name() == 'PENDING'} ? 'active'">Pendientes</a>
    <a th:href="@{/tasks(status='IN_PROGRESS')}" th:classappend="${selectedStatus != null and selectedStatus.name() == 'IN_PROGRESS'} ? 'active'">En progreso</a>
    <a th:href="@{/tasks(status='COMPLETED')}" th:classappend="${selectedStatus != null and selectedStatus.name() == 'COMPLETED'} ? 'active'">Completadas</a>
</div>

<div class="task-list" id="taskTableBody">
    <div class="task" th:each="task : ${tasks}" th:classappend="${task.status != null and task.status.name() == 'COMPLETED'} ? 'completed'">
        <div class="task-info">
            <div class="task-title-row">
                <span class="dot" th:classappend="'dot-' + ${task.priority != null ? task.priority : 'MEDIUM'}"></span>
                <p class="task-title" th:text="${task.title != null ? task.title : 'Sin título'}"></p>
            </div>
            <p class="task-desc" th:if="${task.description != null}" th:text="${task.description}"></p>
            <div class="task-meta">
                <span th:if="${task.dueDate != null}" th:text="${task.dueDate}"></span>
                <span th:text="${task.status != null ? task.status : 'Sin estado'}"></span>
            </div>
        </div>
        <div class="task-actions">
            <a th:href="@{/tasks/{id}/edit(id=${task.taskId})}" class="btn-icon" title="Editar"><i class="ti ti-edit"></i></a>
            <form th:action="@{/tasks/{id}/delete(id=${task.taskId})}" method="post"
                  onsubmit="return confirm('¿Eliminar esta tarea?');">
                <button type="submit" class="btn-icon" title="Eliminar"><i class="ti ti-trash"></i></button>
            </form>
        </div>
    </div>
</div>

<p class="empty" th:if="${tasks.isEmpty()}">No hay tareas registradas.</p>

<div class="summary">
    <span><strong th:text="${tasks.?[status != null and status.name() == 'PENDING'].size()}">0</strong> pendiente</span>
    <span><strong th:text="${tasks.?[status != null and status.name() == 'IN_PROGRESS'].size()}">0</strong> en progreso</span>
    <span><strong th:text="${tasks.?[status != null and status.name() == 'COMPLETED'].size()}">0</strong> completada</span>
</div>

<script>
    const eventSource = new EventSource('/tasks/stream');

    function refreshTaskList() {
        fetch(window.location.href)
            .then(res => res.text())
            .then(html => {
                const nuevaLista = new DOMParser().parseFromString(html, 'text/html').querySelector('#taskTableBody');
                document.querySelector('#taskTableBody').innerHTML = nuevaLista.innerHTML;
            });
    }

    eventSource.addEventListener('task-created', refreshTaskList);
    eventSource.addEventListener('task-updated', refreshTaskList);
    eventSource.addEventListener('task-deleted', refreshTaskList);
</script>

</body>
</html>
